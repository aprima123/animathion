<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animathion - Trigonometri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
  :root {
    --bg-page: #f4f1ea; --grid-color: #e3ded1; --ink: #111111;
    --hl-blue: #60c3ff; --hl-green: #a3f160; --hl-yellow: #ffe566; --hl-purple: #c48aff; --hl-pink: #ff99cc; --shadow: 4px 4px 0px var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background-color: var(--bg-page);
    background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 30px 30px; color: var(--ink); font-family: 'Space Grotesk', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; touch-action: none;
  }

  /* Animasi Navigasi */
  @keyframes slideDownFade { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .back-btn {
    position: fixed; top: 20px; left: 20px; background: var(--hl-yellow); border: 3px solid var(--ink); color: var(--ink);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.9rem;
    text-decoration: none; display: flex; align-items: center; gap: 6px; transition: 0.1s; box-shadow: var(--shadow); z-index: 1000;
    opacity: 0; animation: slideDownFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--ink); }
  .back-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  .app-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 1100px; }
  
  .panel { 
    background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); 
    opacity: 0; animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .panel:nth-child(1) { animation-delay: 0.1s; } /* Panel Kontrol */
  .panel:nth-child(2) { animation-delay: 0.2s; } /* Panel Kanvas */

  h2 { margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }

  /* Layout Kanvas */
  .canvas-container {
    display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center;
  }
  .canvas-box {
    border: 3px solid var(--ink); border-radius: 8px; background: #fff; box-shadow: 2px 2px 0 var(--ink);
    position: relative; overflow: hidden;
  }
  #cv_circle { width: 320px; height: 320px; }
  #cv_wave { width: 100%; max-width: 600px; height: 320px; }

  /* UI Kontrol */
  .degree-display {
    text-align: center; font-size: 2rem; font-weight: 700; font-family: monospace;
    margin-bottom: 15px; color: var(--ink);
  }
  .degree-display span { color: #ff2a55; }

  .control-group { margin-bottom: 15px; }
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 12px; cursor: pointer; background: #e0e0e0; border-radius: 6px; border: 2px solid var(--ink); }
  input[type=range]::-webkit-slider-thumb { height: 24px; width: 24px; border-radius: 50%; background: var(--hl-yellow); border: 3px solid var(--ink); cursor: pointer; -webkit-appearance: none; margin-top: -8px; box-shadow: 1px 1px 0 var(--ink); }
  input[type=range]::-webkit-slider-thumb:hover { background: var(--hl-purple); }

  .btn-play {
    width: 100%; padding: 12px; background: var(--hl-green); border: 3px solid var(--ink);
    border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 1rem; cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink); transition: 0.1s; margin-bottom: 15px;
  }
  .btn-play:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .btn-play:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn-play.playing { background: var(--hl-pink); }

  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;
  }
  .info-item {
    background: var(--bg-page); border: 2px dashed var(--ink); border-radius: 6px; padding: 8px 12px;
    font-family: monospace; font-size: 0.95rem; display: flex; justify-content: space-between;
  }
  .info-item .label { font-weight: 700; }
  .info-item .value { color: #ff2a55; font-weight: 700; }
  /* Warna khusus tiap fungsi */
  .item-sin .value { color: #00d2ff; }
  .item-cos .value { color: #ff99cc; }
  .item-tan .value { color: #b500ff; }
  .item-csc .value { color: #f39c12; }
  .item-sec .value { color: #1abc9c; }
  .item-cot .value { color: #e74c3c; }

  @media (max-width: 800px) {
    body { justify-content: flex-start; padding: 80px 10px 30px 10px; overflow-y: auto; touch-action: pan-y; }
    .app-container { flex-direction: column; align-items: center; gap: 15px; }
    .panel { width: 100%; max-width: 500px; padding: 15px; }
    .back-btn { top: 15px; left: 15px; padding: 8px 14px; font-size: 0.85rem; }
    #cv_circle { width: 100%; max-width: 320px; height: auto; aspect-ratio: 1/1; }
    #cv_wave { width: 100%; height: auto; aspect-ratio: 2/1; }
  }
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>

  <div class="app-container">
    <!-- Panel Kontrol -->
    <div class="panel" style="flex: 1; min-width: 300px;">
      <h2>Trigonometri</h2>
      
      <div class="degree-display">θ = <span id="lbl-sudut">0°</span></div>

      <div class="control-group">
        <input type="range" id="slider-sudut" min="0" max="360" step="1" value="0">
      </div>

      <button class="btn-play" id="btn-play">▶ Putar Otomatis</button>

      <div class="info-grid">
        <div class="info-item item-sin"><span class="label">sin(θ)</span> <span class="value" id="val-sin">0.00</span></div>
        <div class="info-item item-cos"><span class="label">cos(θ)</span> <span class="value" id="val-cos">1.00</span></div>
        <div class="info-item item-tan"><span class="label">tan(θ)</span> <span class="value" id="val-tan">0.00</span></div>
        <div class="info-item item-csc"><span class="label">csc(θ)</span> <span class="value" id="val-csc">~</span></div>
        <div class="info-item item-sec"><span class="label">sec(θ)</span> <span class="value" id="val-sec">1.00</span></div>
        <div class="info-item item-cot"><span class="label">cot(θ)</span> <span class="value" id="val-cot">~</span></div>
      </div>
    </div>

    <!-- Panel Kanvas -->
    <div class="panel" style="flex: 2; min-width: 300px; display: flex; justify-content: center;">
      <div class="canvas-container">
        <div class="canvas-box">
          <canvas id="cv_circle" width="320" height="320"></canvas>
        </div>
        <div class="canvas-box">
          <canvas id="cv_wave" width="600" height="320"></canvas>
        </div>
      </div>
    </div>
  </div>

<script>
// ==========================================
// SETUP CANVAS & STATE
// ==========================================
const cvsCircle = document.getElementById('cv_circle'); const ctxCircle = cvsCircle.getContext('2d');
const cvsWave = document.getElementById('cv_wave'); const ctxWave = cvsWave.getContext('2d');
const Wc = cvsCircle.width, Hc = cvsCircle.height;
const Ww = cvsWave.width, Hw = cvsWave.height;

// Pusat lingkaran
const cx = Wc/2, cy = Hc/2, R = 100;

// State Animasi
let curAngle = 0;
let tgtAngle = 0;
let isPlaying = false;
let playSpeed = 1.5; // derajat per frame
let animFrame = null;

// DOM Elements
const elSudut = document.getElementById('slider-sudut');
const lblSudut = document.getElementById('lbl-sudut');
const valSin = document.getElementById('val-sin');
const valCos = document.getElementById('val-cos');
const valTan = document.getElementById('val-tan');
const valCsc = document.getElementById('val-csc');
const valSec = document.getElementById('val-sec');
const valCot = document.getElementById('val-cot');
const btnPlay = document.getElementById('btn-play');

// ==========================================
// LOGIKA MATEMATIKA & RENDER
// ==========================================
function updateUI(angle) {
  const rad = angle * Math.PI / 180;
  lblSudut.innerText = Math.round(angle) + '°';
  
  // Hitung nilai trigonometri
  const s = Math.sin(rad);
  const c = Math.cos(rad);
  const t = Math.tan(rad);

  valSin.innerText = s.toFixed(3);
  valCos.innerText = c.toFixed(3);
  
  // Tangen (Tan) mendekati tak hingga di 90 dan 270
  if(Math.abs(t) > 50) valTan.innerText = (t > 0 ? "∞" : "-∞");
  else valTan.innerText = t.toFixed(3);

  // Cosecan (1/sin)
  if(Math.abs(s) < 0.01) valCsc.innerText = "∞";
  else valCsc.innerText = (1/s).toFixed(3);

  // Secan (1/cos)
  if(Math.abs(c) < 0.01) valSec.innerText = "∞";
  else valSec.innerText = (1/c).toFixed(3);

  // Cotangen (1/tan)
  if(Math.abs(t) > 50) valCot.innerText = "0.000";
  else valCot.innerText = (1/t).toFixed(3);
}

function draw(angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  
  // ==========================================
  // 1. GAMBAR LINGKARAN SATUAN (KIRI)
  // ==========================================
  ctxCircle.clearRect(0, 0, Wc, Hc);
  
  // Grid
  ctxCircle.strokeStyle = '#e0e0e0'; ctxCircle.lineWidth = 1;
  for(let i=0; i<Wc; i+=30) { ctxCircle.beginPath(); ctxCircle.moveTo(i,0); ctxCircle.lineTo(i,Hc); ctxCircle.stroke(); }
  for(let i=0; i<Hc; i+=30) { ctxCircle.beginPath(); ctxCircle.moveTo(0,i); ctxCircle.lineTo(Wc,i); ctxCircle.stroke(); }

  // Sumbu X & Y
  ctxCircle.strokeStyle = '#111'; ctxCircle.lineWidth = 2;
  ctxCircle.beginPath(); ctxCircle.moveTo(0, cy); ctxCircle.lineTo(Wc, cy); ctxCircle.stroke();
  ctxCircle.beginPath(); ctxCircle.moveTo(cx, 0); ctxCircle.lineTo(cx, Hc); ctxCircle.stroke();
  
  // Lingkaran
  ctxCircle.strokeStyle = '#111'; ctxCircle.lineWidth = 3;
  ctxCircle.beginPath(); ctxCircle.arc(cx, cy, R, 0, Math.PI*2); ctxCircle.stroke();

  // Posisi Titik di Ujung Jari-jari
  const px = cx + R * Math.cos(rad);
  const py = cy - R * Math.sin(rad); // Canvas Y dibalik

  // Garis Jari-jari
  ctxCircle.strokeStyle = '#111'; ctxCircle.lineWidth = 3;
  ctxCircle.beginPath(); ctxCircle.moveTo(cx, cy); ctxCircle.lineTo(px, py); ctxCircle.stroke();

  // Titik Ujung
  ctxCircle.fillStyle = '#ffe566'; ctxCircle.beginPath(); ctxCircle.arc(px, py, 6, 0, Math.PI*2); ctxCircle.fill();
  ctxCircle.strokeStyle = '#111'; ctxCircle.lineWidth = 2; ctxCircle.stroke();

  // Proyeksi Sinus (Vertikal - Biru) dan Cosinus (Horizontal - Pink)
  ctxCircle.strokeStyle = '#00d2ff'; ctxCircle.lineWidth = 3;
  ctxCircle.beginPath(); ctxCircle.moveTo(cx, cy); ctxCircle.lineTo(cx, py); ctxCircle.stroke(); // Sin

  ctxCircle.strokeStyle = '#ff99cc'; ctxCircle.lineWidth = 3;
  ctxCircle.beginPath(); ctxCircle.moveTo(cx, cy); ctxCircle.lineTo(px, cy); ctxCircle.stroke(); // Cos
  
  // Garis bantu putus-putus
  ctxCircle.strokeStyle = '#333'; ctxCircle.lineWidth = 1.5; ctxCircle.setLineDash([4,4]);
  ctxCircle.beginPath(); ctxCircle.moveTo(px, py); ctxCircle.lineTo(px, cy); ctxCircle.stroke(); // Bantu Cos
  ctxCircle.beginPath(); ctxCircle.moveTo(px, py); ctxCircle.lineTo(cx, py); ctxCircle.stroke(); // Bantu Sin
  ctxCircle.setLineDash([]);

  // ==========================================
  // 2. GAMBAR GELOMBANG SINUS & COSINUS (KANAN)
  // ==========================================
  ctxWave.clearRect(0, 0, Ww, Hw);
  
  const waveStartX = 30, waveWidth = 540, waveMidY = Hw / 2;
  const amplitude = 110;

  // Grid
  ctxWave.strokeStyle = '#e0e0e0'; ctxWave.lineWidth = 1;
  for(let i=0; i<Ww; i+=30) { ctxWave.beginPath(); ctxWave.moveTo(i,0); ctxWave.lineTo(i,Hw); ctxWave.stroke(); }
  for(let i=0; i<Hw; i+=30) { ctxWave.beginPath(); ctxWave.moveTo(0,i); ctxWave.lineTo(Ww,i); ctxWave.stroke(); }

  // Sumbu X (Garis Tengah)
  ctxWave.strokeStyle = '#111'; ctxWave.lineWidth = 2;
  ctxWave.beginPath(); ctxWave.moveTo(waveStartX, waveMidY); ctxWave.lineTo(waveStartX + waveWidth, waveMidY); ctxWave.stroke();

  // Gambar Kurva Sinus (Biru)
  ctxWave.strokeStyle = '#00d2ff'; ctxWave.lineWidth = 3;
  ctxWave.beginPath();
  for(let i=0; i<=waveWidth; i++) {
    const deg = (i / waveWidth) * 360;
    const r = deg * Math.PI / 180;
    const y = waveMidY - Math.sin(r) * amplitude;
    if(i === 0) ctxWave.moveTo(waveStartX + i, y);
    else ctxWave.lineTo(waveStartX + i, y);
  }
  ctxWave.stroke();

  // Gambar Kurva Cosinus (Pink)
  ctxWave.strokeStyle = '#ff99cc'; ctxWave.lineWidth = 3;
  ctxWave.beginPath();
  for(let i=0; i<=waveWidth; i++) {
    const deg = (i / waveWidth) * 360;
    const r = deg * Math.PI / 180;
    const y = waveMidY - Math.cos(r) * amplitude;
    if(i === 0) ctxWave.moveTo(waveStartX + i, y);
    else ctxWave.lineTo(waveStartX + i, y);
  }
  ctxWave.stroke();

  // Titik Aktif di Gelombang
  const activeWaveX = waveStartX + (angleDeg / 360) * waveWidth;
  const activeWaveYSin = waveMidY - Math.sin(rad) * amplitude;
  const activeWaveYCos = waveMidY - Math.cos(rad) * amplitude;

  // Titik Sinus
  ctxWave.fillStyle = '#00d2ff'; ctxWave.beginPath(); ctxWave.arc(activeWaveX, activeWaveYSin, 6, 0, Math.PI*2); ctxWave.fill();
  ctxWave.strokeStyle = '#111'; ctxWave.lineWidth = 2; ctxWave.stroke();

  // Titik Cosinus
  ctxWave.fillStyle = '#ff99cc'; ctxWave.beginPath(); ctxWave.arc(activeWaveX, activeWaveYCos, 6, 0, Math.PI*2); ctxWave.fill();
  ctxWave.strokeStyle = '#111'; ctxWave.lineWidth = 2; ctxWave.stroke();

  // Garis Vertikal Penghubung Sudut
  ctxWave.strokeStyle = 'rgba(0,0,0,0.2)'; ctxWave.lineWidth = 1.5; ctxWave.setLineDash([4,4]);
  ctxWave.beginPath(); ctxWave.moveTo(activeWaveX, 0); ctxWave.lineTo(activeWaveX, Hw); ctxWave.stroke();
  ctxWave.setLineDash([]);

  // Update Nilai Teks
  updateUI(angleDeg);
}

// ==========================================
// LOGIKA KONTROL & ANIMASI
// ==========================================
function animate() {
  if(isPlaying) {
    tgtAngle += playSpeed;
    if(tgtAngle >= 360) tgtAngle = 0;
    elSudut.value = tgtAngle;
  }

  // Interpolasi halus
  const diff = tgtAngle - curAngle;
  if(Math.abs(diff) > 0.5) {
    curAngle += diff * 0.15;
  } else {
    curAngle = tgtAngle;
  }

  // Cegah loop 360 ke 0 agar tidak berputar balik
  if(Math.abs(tgtAngle - curAngle) > 180) {
    curAngle = tgtAngle;
  }

  draw(curAngle);
  animFrame = requestAnimationFrame(animate);
}

// Event Listener
elSudut.addEventListener('input', (e) => {
  isPlaying = false;
  btnPlay.innerText = "▶ Putar Otomatis";
  btnPlay.classList.remove('playing');
  tgtAngle = parseFloat(e.target.value);
  // Reset posisi curAngle jika jarak terlalu jauh agar lompatannya wajar
  if(Math.abs(curAngle - tgtAngle) > 90) curAngle = tgtAngle;
});

btnPlay.addEventListener('click', () => {
  isPlaying = !isPlaying;
  if(isPlaying) {
    btnPlay.innerText = "⏸ Hentikan";
    btnPlay.classList.add('playing');
  } else {
    btnPlay.innerText = "▶ Putar Otomatis";
    btnPlay.classList.remove('playing');
  }
});

// Mulai Animasi
animate();
</script>
</body>
</html>
