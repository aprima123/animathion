<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animathion - Trigonometri</title>
<link rel="stylesheet" href="shared/animathion.css">
<style>
  .degree-display{text-align:center;font:700 2rem monospace;margin-bottom:15px}
  .degree-display span{color:#b500ff}
  .btn-play{width:100%;padding:12px;margin:5px 0 20px;font:700 1rem inherit;font-family:inherit;background:var(--hl-green);border:3px solid var(--ink);border-radius:8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.1s}
  .btn-play:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .btn-play:active{transform:translate(2px,2px);box-shadow:none}
  .btn-play.playing{background:var(--hl-pink)}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .info-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:3px solid var(--ink);border-radius:8px;background:#fff;font-family:monospace;font-weight:700}
  .item-sin{background:#c9ecff}.item-cos{background:#ffd9ec}.item-tan{background:#e3ffc2}
  .item-csc,.item-sec,.item-cot{background:#fff6bf}
  .canvas-container{display:flex;flex-direction:column;gap:15px;width:100%;align-items:center}
  .canvas-box{width:100%;display:flex;justify-content:center}
  #cv_circle{max-width:320px;aspect-ratio:1/1;cursor:default}
  #cv_wave{max-width:600px;aspect-ratio:600/320;cursor:default}
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>
  <div class="app-container">
    <div class="panel" style="flex:1;min-width:300px">
      <h2>Trigonometri</h2>
      <div class="degree-display">θ = <span id="lbl-sudut">0°</span></div>
      <div class="control-group"><input type="range" id="slider-sudut" min="0" max="360" step="1" value="0" aria-label="Sudut theta"></div>
      <button class="btn-play" id="btn-play">▶ Putar Otomatis</button>
      <div class="info-grid">
        <div class="info-item item-sin"><span>sin(θ)</span><span id="val-sin">0.000</span></div>
        <div class="info-item item-cos"><span>cos(θ)</span><span id="val-cos">1.000</span></div>
        <div class="info-item item-tan"><span>tan(θ)</span><span id="val-tan">0.000</span></div>
        <div class="info-item item-csc"><span>csc(θ)</span><span id="val-csc">∞</span></div>
        <div class="info-item item-sec"><span>sec(θ)</span><span id="val-sec">1.000</span></div>
        <div class="info-item item-cot"><span>cot(θ)</span><span id="val-cot">∞</span></div>
      </div>
    </div>
    <div class="panel" style="flex:2;min-width:300px;display:flex;justify-content:center">
      <div class="canvas-container">
        <div class="canvas-box"><canvas id="cv_circle" aria-label="Lingkaran satuan"></canvas></div>
        <div class="canvas-box"><canvas id="cv_wave" aria-label="Gelombang sinus dan cosinus"></canvas></div>
      </div>
    </div>
  </div>
<script type="module">
import { setupCanvas, addBanner, addPresets, readState, writeState } from './shared/core.js';
const $ = (id) => document.getElementById(id);
const C = setupCanvas($('cv_circle'), 320, 320), Wv = setupCanvas($('cv_wave'), 600, 320);
const cc = C.ctx, cw = Wv.ctx, R = 100, cx = 160, cy = 160;
const slider = $('slider-sudut'), btn = $('btn-play');

function line(c, x1, y1, x2, y2, color, w = 2, dash = null) {
  c.strokeStyle = color; c.lineWidth = w; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]);
}
function dot(c, x, y, fill) { c.fillStyle = fill; c.beginPath(); c.arc(x, y, 6, 0, Math.PI * 2); c.fill(); c.strokeStyle = '#111'; c.lineWidth = 2; c.stroke(); }
// grid sejajar titik pusat (bukan dari pojok kiri atas)
function grid(c, w, h, ox, oy) {
  for (let x = ox % 30; x <= w; x += 30) line(c, x, 0, x, h, '#e0e0e0', 1);
  for (let y = oy % 30; y <= h; y += 30) line(c, 0, y, w, y, '#e0e0e0', 1);
}
const lim = (v, d = 3) => v.toFixed(d);

function values(deg) {
  const r = deg * Math.PI / 180, s = Math.sin(r), c = Math.cos(r), t = Math.tan(r);
  $('lbl-sudut').textContent = Math.round(deg) + '°';
  $('val-sin').textContent = lim(s); $('val-cos').textContent = lim(c);
  $('val-tan').textContent = Math.abs(t) > 50 ? (t > 0 ? '∞' : '-∞') : lim(t);
  $('val-csc').textContent = Math.abs(s) < 0.01 ? '∞' : lim(1 / s);
  $('val-sec').textContent = Math.abs(c) < 0.01 ? '∞' : lim(1 / c);
  $('val-cot').textContent = Math.abs(t) > 50 ? '0.000' : lim(1 / t);
}

function draw(deg) {
  const rad = deg * Math.PI / 180;
  // ---- lingkaran satuan ----
  cc.clearRect(0, 0, 320, 320); grid(cc, 320, 320, cx, cy);
  line(cc, 0, cy, 320, cy, '#111'); line(cc, cx, 0, cx, 320, '#111');
  cc.strokeStyle = '#111'; cc.lineWidth = 3; cc.beginPath(); cc.arc(cx, cy, R, 0, Math.PI * 2); cc.stroke();
  const px = cx + R * Math.cos(rad), py = cy - R * Math.sin(rad);
  line(cc, cx, cy, px, py, '#111', 3);
  line(cc, cx, cy, cx, py, '#00a8d6', 3); line(cc, cx, cy, px, cy, '#ff6fb5', 3);
  line(cc, px, py, px, cy, '#333', 1.5, [4, 4]); line(cc, px, py, cx, py, '#333', 1.5, [4, 4]);
  dot(cc, px, py, '#ffe566');
  // ---- gelombang ----
  const x0 = 30, ww = 540, my = 160, amp = 110;
  cw.clearRect(0, 0, 600, 320); grid(cw, 600, 320, x0, my);
  line(cw, x0, my, x0 + ww, my, '#111');
  for (const [fn, col] of [[Math.sin, '#00a8d6'], [Math.cos, '#ff6fb5']]) {
    cw.strokeStyle = col; cw.lineWidth = 3; cw.beginPath();
    for (let i = 0; i <= ww; i++) { const y = my - fn(i / ww * 2 * Math.PI) * amp; i ? cw.lineTo(x0 + i, y) : cw.moveTo(x0 + i, y); }
    cw.stroke();
  }
  const ax = x0 + deg / 360 * ww;
  line(cw, ax, 0, ax, 320, 'rgba(0,0,0,.25)', 1.5, [4, 4]);
  dot(cw, ax, my - Math.sin(rad) * amp, '#60c3ff'); dot(cw, ax, my - Math.cos(rad) * amp, '#ff99cc');
  values(deg);
}

// Animasi berbasis waktu: 90°/detik saat play, peredaman halus saat slider digeser.
let cur = 0, tgt = 0, playing = false, last = performance.now(), shown = -1;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (playing) { tgt = (tgt + 90 * dt) % 360; cur = tgt; slider.value = Math.round(tgt); }
  else { const d = tgt - cur; cur = Math.abs(d) > 0.01 ? cur + d * (1 - Math.exp(-12 * dt)) : tgt; }
  if (cur !== shown) { draw(cur); shown = cur; }
  requestAnimationFrame(frame);
}
function setPlaying(p) { playing = p; btn.textContent = p ? '⏸ Hentikan' : '▶ Putar Otomatis'; btn.classList.toggle('playing', p); }
const go = (a) => { setPlaying(false); tgt = a; slider.value = a; if (Math.abs(cur - tgt) > 180) cur = tgt; writeState({ t: a }); };
slider.addEventListener('input', () => go(+slider.value));
btn.addEventListener('click', () => setPlaying(!playing));
addBanner('Titik di lingkaran satuan berkoordinat <b>(cos θ, sin θ)</b>. Saat θ berputar, <b>tinggi</b> titik menggambar gelombang sinus dan <b>lebarnya</b> menggambar gelombang cosinus.');
addPresets($('btn-play').parentElement, [0, 30, 45, 60, 90, 180, 270].map((a) => ({ label: a + '°', a })), (p) => go(p.a), $('btn-play'));
const st = readState();
if (st.t !== undefined && isFinite(+st.t)) { tgt = cur = Math.max(0, Math.min(360, +st.t)); slider.value = tgt; }
requestAnimationFrame(frame);
</script>
</body>
</html>
