<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animathion - Fungsi Kuadrat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
  :root {
    --bg-page: #f4f1ea; --grid-color: #e3ded1; --ink: #111111;
    --hl-blue: #60c3ff; --hl-green: #a3f160; --hl-yellow: #ffe566; --hl-purple: #c48aff; --shadow: 4px 4px 0px var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background-color: var(--bg-page);
    background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 30px 30px; color: var(--ink); font-family: 'Space Grotesk', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; touch-action: none;
  }

  /* Animasi Tombol Kembali */
  @keyframes slideDownFade { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
  .back-btn {
    position: fixed; top: 20px; left: 20px; background: var(--hl-yellow); border: 3px solid var(--ink); color: var(--ink);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.9rem;
    text-decoration: none; display: flex; align-items: center; gap: 6px; transition: 0.1s; box-shadow: var(--shadow); z-index: 1000;
    opacity: 0; animation: slideDownFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--ink); }
  .back-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  .app-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 1000px; }
  
  /* Animasi Panel Masuk */
  @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  .panel { 
    background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); 
    opacity: 0; animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .panel:nth-child(1) { animation-delay: 0.1s; } /* Panel Kontrol */
  .panel:nth-child(2) { animation-delay: 0.2s; } /* Panel Grafik */

  h2 { margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 700; text-transform: uppercase; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }

  .control-group { margin-bottom: 20px; }
  .control-label { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; font-size: 1.1rem; }
  .control-label span { color: var(--hl-blue); }
  
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 12px; cursor: pointer; background: #e0e0e0; border-radius: 6px; border: 2px solid var(--ink); }
  input[type=range]::-webkit-slider-thumb { height: 24px; width: 24px; border-radius: 50%; background: var(--hl-yellow); border: 3px solid var(--ink); cursor: pointer; -webkit-appearance: none; margin-top: -8px; box-shadow: 1px 1px 0 var(--ink); }
  input[type=range]::-webkit-slider-thumb:hover { background: var(--hl-purple); }

  .info-box { margin-top: 15px; font-size: 0.9rem; line-height: 1.6; background: var(--bg-page); padding: 12px; border: 2px dashed var(--ink); border-radius: 6px; }
  .info-box b { font-weight: 700; }

  .canvas-wrap { position: relative; display: flex; flex-direction: column; }
  canvas { border-radius: 8px; background: #fff; border: 3px solid var(--ink); display: block; width: 100%; max-width: 500px; height: auto; aspect-ratio: 1 / 1; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  .zoom-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
  .zoom-controls button { width: 36px; height: 36px; border-radius: 6px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 1.1rem; cursor: pointer; font-weight: 700; transition: 0.1s; box-shadow: 2px 2px 0 var(--ink); }
  .zoom-controls button:hover { background: var(--hl-yellow); }
  .zoom-controls button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  @media (max-width: 800px) {
    body { justify-content: flex-start; padding: 80px 10px 30px 10px; overflow-y: auto; touch-action: pan-y; }
    .app-container { flex-direction: column; align-items: center; gap: 15px; }
    .panel { width: 100%; max-width: 500px; padding: 15px; }
    .back-btn { top: 15px; left: 15px; padding: 8px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>

  <div class="app-container">
    <div class="panel" style="flex: 1; min-width: 300px;">
      <h2>Persamaan Kuadrat</h2>
      <div style="text-align:center; font-size: 1.5rem; font-weight:bold; font-family:monospace; margin-bottom: 20px;">
        y = <span id="lbl-a" style="color:#ff2a55">1</span>x² + 
        <span id="lbl-b" style="color:#00d2ff">0</span>x + 
        <span id="lbl-c" style="color:#b500ff">0</span>
      </div>

      <div class="control-group">
        <div class="control-label">Nilai <b>a</b> (Kelengkungan) <span id="val-a">1</span></div>
        <input type="range" id="slider-a" min="-10" max="10" step="0.1" value="1">
      </div>
      <div class="control-group">
        <div class="control-label">Nilai <b>b</b> (Geser) <span id="val-b">0</span></div>
        <input type="range" id="slider-b" min="-15" max="15" step="0.1" value="0">
      </div>
      <div class="control-group">
        <div class="control-label">Nilai <b>c</b> (Titik Potong Y) <span id="val-c">0</span></div>
        <input type="range" id="slider-c" min="-15" max="15" step="0.1" value="0">
      </div>

      <div class="info-box" id="info-panel"></div>
    </div>

    <div class="panel canvas-wrap">
      <h2>Grafik Parabola</h2>
      <canvas id="cv_kuadrat" width="600" height="600"></canvas>
      <div class="zoom-controls">
        <button id="z_in" title="Zoom in">+</button>
        <button id="z_out" title="Zoom out">−</button>
        <button id="z_reset" title="Reset">⟲</button>
      </div>
    </div>
  </div>

<script>
const cv = document.getElementById('cv_kuadrat');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let view = { scale: 40, cx: W/2, cy: H/2 };
const MIN_SCALE = 2, MAX_SCALE = 200;

let curA = 1, curB = 0, curC = 0;
let tgtA = 1, tgtB = 0, tgtC = 0;
let animFrame = null;

const elA = document.getElementById('slider-a'); const elB = document.getElementById('slider-b'); const elC = document.getElementById('slider-c');
const lblA = document.getElementById('val-a'); const lblB = document.getElementById('val-b'); const lblC = document.getElementById('val-c');
const txtA = document.getElementById('lbl-a'); const txtB = document.getElementById('lbl-b'); const txtC = document.getElementById('lbl-c');
const infoPanel = document.getElementById('info-panel');

function w2p(x, y) { return [ view.cx + x*view.scale, view.cy - y*view.scale ]; }
function p2w(px, py) { return [ (px - view.cx)/view.scale, (view.cy - py)/view.scale ]; }

function triggerUpdate() {
  tgtA = parseFloat(elA.value); tgtB = parseFloat(elB.value); tgtC = parseFloat(elC.value);
  lblA.innerText = tgtA.toFixed(1); lblB.innerText = tgtB.toFixed(1); lblC.innerText = tgtC.toFixed(1);
  txtA.innerText = tgtA.toFixed(1); txtB.innerText = tgtB.toFixed(1); txtC.innerText = tgtC.toFixed(1);

  if(animFrame) cancelAnimationFrame(animFrame);
  function animate() {
    let changed = false;
    const diffA = tgtA - curA, diffB = tgtB - curB, diffC = tgtC - curC;
    if(Math.abs(diffA) > 0.01 || Math.abs(diffB) > 0.01 || Math.abs(diffC) > 0.01) {
      curA += diffA * 0.15; curB += diffB * 0.15; curC += diffC * 0.15; changed = true;
    } else { curA = tgtA; curB = tgtB; curC = tgtC; }
    draw(curA, curB, curC);
    if(changed) animFrame = requestAnimationFrame(animate);
  }
  animate();
}

function draw(a, b, c) {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
  const startX = Math.floor(p2w(0,0)[0]); const endX = Math.ceil(p2w(W,0)[0]);
  const startY = Math.floor(p2w(0,H)[1]); const endY = Math.ceil(p2w(0,0)[1]);
  for(let i=startX; i<=endX; i++) { const [px] = w2p(i, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke(); }
  for(let i=startY; i<=endY; i++) { const [,py] = w2p(0, i); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke(); }

  ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, view.cy); ctx.lineTo(W, view.cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(view.cx, 0); ctx.lineTo(view.cx, H); ctx.stroke();

  const vertexX = -b / (2*a);
  const vertexY = a*vertexX*vertexX + b*vertexX + c;
  const D = b*b - 4*a*c;

  const [vx_px, vy_px] = w2p(vertexX, vertexY);
  ctx.strokeStyle = 'rgba(181, 0, 255, 0.5)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(vx_px, 0); ctx.lineTo(vx_px, H); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle = '#ff2a55'; ctx.lineWidth = 3;
  ctx.beginPath(); let first = true;
  for(let px=0; px<=W; px+=2) {
    const [wx] = p2w(px, 0); const wy = a*wx*wx + b*wx + c; const [, py] = w2p(wx, wy);
    if(py > -1000 && py < H+1000) { if(first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); } } else { first = true; }
  }
  ctx.stroke();

  ctx.fillStyle = '#b500ff'; ctx.beginPath(); ctx.arc(vx_px, vy_px, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = 'bold 12px monospace';
  ctx.fillText(`Puncak (${vertexX.toFixed(1)}, ${vertexY.toFixed(1)})`, vx_px + 10, vy_px - 10);

  if(D >= 0 && Math.abs(a) > 0.01) {
    const x1 = (-b + Math.sqrt(D)) / (2*a); const x2 = (-b - Math.sqrt(D)) / (2*a);
    const drawRoot = (x, label) => {
      const [rx, ry] = w2p(x, 0); ctx.fillStyle = '#ffe566';
      ctx.beginPath(); ctx.arc(rx, ry, 6, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#111'; ctx.fillText(`${label}: ${x.toFixed(1)}`, rx - 20, ry + 20);
    };
    drawRoot(x1, 'x₁'); if(Math.abs(x1 - x2) > 0.1) drawRoot(x2, 'x₂');
  }

  let infoText = `Titik Puncak: <b>(${vertexX.toFixed(2)}, ${vertexY.toFixed(2)})</b><br>`;
  if(Math.abs(a) < 0.01) infoText += "Karena a = 0, ini <b>garis lurus</b>.";
  else if(D > 0) infoText += `Memotong sumbu X di <b>2 titik</b>.`;
  else if(Math.abs(D) < 0.01) infoText += `Menyinggung sumbu X di <b>1 titik</b>.`;
  else infoText += `Tidak memotong sumbu X.`;
  infoPanel.innerHTML = infoText;
}

elA.addEventListener('input', triggerUpdate); elB.addEventListener('input', triggerUpdate); elC.addEventListener('input', triggerUpdate);

cv.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = cv.getBoundingClientRect(); const mx = (ev.clientX - rect.left) * (cv.width / rect.width); const my = (ev.clientY - rect.top) * (cv.height / rect.height);
  const [wx, wy] = p2w(mx, my); const factor = ev.deltaY < 0 ? 1.15 : 1/1.15;
  view.scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale * factor));
  view.cx = mx - wx * view.scale; view.cy = my + wy * view.scale;
  draw(curA, curB, curC);
}, { passive: false });

let isDragging = false, last = null;
cv.addEventListener('mousedown', (ev) => { isDragging = true; last = {x:ev.clientX, y:ev.clientY}; });
window.addEventListener('mousemove', (ev) => {
  if(!isDragging) return;
  const rect = cv.getBoundingClientRect(); const ratio = cv.width / rect.width; 
  view.cx += (ev.clientX - last.x) * ratio; view.cy += (ev.clientY - last.y) * ratio;
  last = {x:ev.clientX, y:ev.clientY}; draw(curA, curB, curC);
});
window.addEventListener('mouseup', () => isDragging = false);

document.getElementById('z_in').onclick = () => { view.scale = Math.min(MAX_SCALE, view.scale * 1
