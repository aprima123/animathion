<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animathion - Fungsi Kuadrat</title>
<link rel="stylesheet" href="shared/animathion.css">
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>
  <div class="app-container">
    <div class="panel" style="flex:1;min-width:300px">
      <h2>Persamaan Kuadrat</h2>
      <div style="text-align:center;font-size:1.5rem;font-weight:700;font-family:monospace;margin-bottom:20px">
        y = <span id="lbl-a" style="color:#ff2a55">1</span>x² +
        <span id="lbl-b" style="color:#00a8d6">0</span>x +
        <span id="lbl-c" style="color:#b500ff">0</span>
      </div>
      <div class="control-group"><div class="control-label">Nilai <b>a</b> (Kelengkungan) <span id="val-a">1</span></div>
        <input type="range" id="slider-a" min="-10" max="10" step="0.1" value="1"></div>
      <div class="control-group"><div class="control-label">Nilai <b>b</b> (Geser) <span id="val-b">0</span></div>
        <input type="range" id="slider-b" min="-15" max="15" step="0.1" value="0"></div>
      <div class="control-group"><div class="control-label">Nilai <b>c</b> (Titik Potong Y) <span id="val-c">0</span></div>
        <input type="range" id="slider-c" min="-15" max="15" step="0.1" value="0"></div>
      <div class="info-box" id="info-panel"></div>
    </div>
    <div class="panel canvas-wrap">
      <h2>Grafik Parabola</h2>
      <canvas id="cv" aria-label="Grafik parabola"></canvas>
      <div class="zoom-controls">
        <button id="z_in" title="Zoom in">+</button><button id="z_out" title="Zoom out">−</button><button id="z_reset" title="Reset">⟲</button>
      </div>
    </div>
  </div>
<script type="module">
import { setupCanvas, Smoother, Viewport, drawGrid, fmt, addBanner, addPresets, readState, writeState } from './shared/core.js';
const $ = (id) => document.getElementById(id);
const { ctx, W, H } = setupCanvas($('cv'), 600);
const vp = new Viewport(W, H, { scale: 40, min: 2, max: 200 });
const sl = { a: $('slider-a'), b: $('slider-b'), c: $('slider-c') };
let hl = null; // bagian rumus yang sedang di-hover

function draw({ a, b, c }) {
  drawGrid(ctx, vp);
  const f = (x) => a * x * x + b * x + c;
  const isLine = Math.abs(a) < 0.05;          // a≈0: bukan parabola, jangan hitung puncak (hindari bagi nol)
  const D = b * b - 4 * a * c;
  let info = '';

  if (!isLine) {
    const vx = -b / (2 * a), vy = f(vx), [vpx] = vp.w2p(vx, vy);
    ctx.strokeStyle = 'rgba(181,0,255,.5)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(vpx, 0); ctx.lineTo(vpx, H); ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.strokeStyle = '#ff2a55'; ctx.lineWidth = 3; ctx.beginPath();
  let pen = false;
  for (let px = 0; px <= W; px += 2) {
    const [wx] = vp.p2w(px, 0), [, py] = vp.w2p(wx, f(wx));
    if (py > -2000 && py < H + 2000) { pen ? ctx.lineTo(px, py) : ctx.moveTo(px, py); pen = true; } else pen = false;
  }
  ctx.stroke();

  const dot = (x, y, fill, label) => {
    const [px, py] = vp.w2p(x, y);
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = 'bold 12px monospace'; ctx.fillText(label, px + 10, py - 10);
  };

  if (hl === 'c') dot(0, c, '#ffe566', `c = ${fmt(c)}: memotong sumbu Y di sini`);
  if (hl === 'b' && !isLine) { const [sx] = vp.w2p(-b / (2 * a), 0); ctx.strokeStyle = '#b500ff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke(); }
  if (hl === 'a') {
    ctx.strokeStyle = 'rgba(255,42,85,.4)'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.beginPath(); let g = false;
    for (let px = 0; px <= W; px += 2) { const [wx] = vp.p2w(px, 0), [, py] = vp.w2p(wx, a * wx * wx); if (py > -2000 && py < H + 2000) { g ? ctx.lineTo(px, py) : ctx.moveTo(px, py); g = true; } else g = false; }
    ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = '#111'; ctx.font = 'bold 13px monospace';
    ctx.fillText(`a = ${fmt(a)}: bentuk dasar (puncak di 0,0), ${Math.abs(a) > 1 ? 'sempit' : 'lebar'}`, 12, 22);
  }
  if (isLine) {
    info = 'Karena a ≈ 0, ini <b>garis lurus</b>, bukan parabola. Geser a menjauhi 0 untuk melihat kurvanya muncul.';
  } else {
    const vx = -b / (2 * a), vy = f(vx);
    dot(vx, vy, '#b500ff', `Puncak (${fmt(vx)}, ${fmt(vy)})`);
    if (D >= 0) {
      const r = Math.sqrt(D), x1 = (-b + r) / (2 * a), x2 = (-b - r) / (2 * a);
      dot(x1, 0, '#ffe566', `x₁: ${fmt(x1)}`);
      if (Math.abs(x1 - x2) > 0.05) dot(x2, 0, '#ffe566', `x₂: ${fmt(x2)}`);
    }
    info = `Titik puncak: <b>(${fmt(vx, 2)}, ${fmt(vy, 2)})</b><br>` +
      (D > 0.01 ? 'Memotong sumbu X di <b>2 titik</b>.' : Math.abs(D) <= 0.01 ? 'Menyinggung sumbu X di <b>1 titik</b>.' : 'Tidak memotong sumbu X.');
    info += `<br>Parabola membuka ke <b>${a > 0 ? 'atas' : 'bawah'}</b>.`;
  }
  $('info-panel').innerHTML = info;
}

const sm = new Smoother({ a: 1, b: 0, c: 0 }, draw, { rate: 10, eps: 0.005 });
function onSlide() {
  const t = { a: +sl.a.value, b: +sl.b.value, c: +sl.c.value };
  for (const k of ['a', 'b', 'c']) { $('val-' + k).textContent = $('lbl-' + k).textContent = fmt(t[k]); }
  sm.set(t); writeState(t);
}
Object.values(sl).forEach((el) => el.addEventListener('input', onSlide));
vp.attach($('cv'), () => sm.redraw(), { zin: $('z_in'), zout: $('z_out'), reset: $('z_reset') });
const setVals = (v) => { ['a', 'b', 'c'].forEach((k, i) => (sl[k].value = v[i])); onSlide(); };
addBanner('Nilai <b>a</b> mengatur arah dan lebar parabola, <b>b</b> menggeser puncaknya ke kiri atau kanan, dan <b>c</b> adalah titik potong dengan sumbu Y. Arahkan kursor ke a, b, atau c di rumus untuk melihat peran masing-masing.');
addPresets($('info-panel').parentElement, [
  { label: 'Dua akar', v: [1, -4, 3] }, { label: 'Menyinggung sumbu X', v: [1, -4, 4] }, { label: 'Tanpa akar', v: [1, 0, 2] },
  { label: 'Membuka ke bawah', v: [-1, 2, 3] }, { label: 'Sempit & curam', v: [4, 0, -2] }], (p) => setVals(p.v), $('info-panel'));
for (const k of ['a', 'b', 'c']) for (const e of [$('lbl-' + k), $('val-' + k).parentElement]) {
  e.classList.add('hov'); e.addEventListener('pointerenter', () => { hl = k; sm.redraw(); }); e.addEventListener('pointerleave', () => { hl = null; sm.redraw(); });
}
const st = readState();
if (['a', 'b', 'c'].some((k) => k in st)) {
  ['a', 'b', 'c'].forEach((k) => { if (st[k] !== undefined && isFinite(+st[k])) sl[k].value = Math.max(+sl[k].min, Math.min(+sl[k].max, +st[k])); });
  onSlide();
} else sm.redraw();
</script>
</body>
</html>
