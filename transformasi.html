<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animathion - Geometri Transformasi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
  :root {
    --bg-page: #f4f1ea; --grid-color: #e3ded1; --ink: #111111;
    --hl-blue: #60c3ff; --hl-green: #a3f160; --hl-yellow: #ffe566; --hl-purple: #c48aff; --hl-pink: #ff99cc; --shadow: 4px 4px 0px var(--ink);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background-color: var(--bg-page);
    background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 30px 30px; color: var(--ink); font-family: 'Space Grotesk', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; touch-action: none;
  }

  @keyframes slideDownFade { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .back-btn {
    position: fixed; top: 20px; left: 20px; background: var(--hl-yellow); border: 3px solid var(--ink); color: var(--ink);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 0.9rem;
    text-decoration: none; display: flex; align-items: center; gap: 6px; transition: 0.1s; box-shadow: var(--shadow); z-index: 1000;
    opacity: 0; animation: slideDownFade 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .back-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--ink); }
  .back-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }

  .app-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 1100px; }
  
  .panel { 
    background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); 
    opacity: 0; animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .panel:nth-child(1) { animation-delay: 0.1s; }
  .panel:nth-child(2) { animation-delay: 0.2s; }

  h2 { margin: 0 0 15px 0; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; border-bottom: 3px solid var(--ink); padding-bottom: 10px; }

  .shape-menu { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
  .shape-btn {
    flex: 1; min-width: 60px; padding: 8px; background: #fff; border: 2px solid var(--ink);
    border-radius: 6px; font-family: inherit; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.1s;
  }
  .shape-btn.active { background: var(--hl-pink); box-shadow: 2px 2px 0 var(--ink); transform: translate(-1px, -1px); }
  .shape-btn:hover:not(.active) { background: #f0f0f0; }

  .tab-menu { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    flex: 1; min-width: 80px; padding: 8px 4px; background: var(--bg-page); border: 2px solid var(--ink);
    border-radius: 6px; font-family: inherit; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.1s;
  }
  .tab-btn.active { background: var(--hl-blue); box-shadow: 2px 2px 0 var(--ink); transform: translate(-1px, -1px); }
  .tab-btn:hover:not(.active) { background: #e0e0e0; }

  .control-group { margin-bottom: 15px; display: none; }
  .control-group.active { display: block; }
  .control-label { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
  .control-label span { color: var(--hl-purple); }

  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 10px; cursor: pointer; background: #e0e0e0; border-radius: 5px; border: 2px solid var(--ink); }
  input[type=range]::-webkit-slider-thumb { height: 20px; width: 20px; border-radius: 50%; background: var(--hl-yellow); border: 3px solid var(--ink); cursor: pointer; -webkit-appearance: none; margin-top: -7px; box-shadow: 1px 1px 0 var(--ink); }
  input[type=range]::-webkit-slider-thumb:hover { background: var(--hl-pink); }

  .info-box { margin-top: 15px; font-size: 0.85rem; line-height: 1.5; background: var(--bg-page); padding: 10px; border: 2px dashed var(--ink); border-radius: 6px; }

  .canvas-wrap { position: relative; display: flex; flex-direction: column; }
  canvas { border-radius: 8px; background: #fff; border: 3px solid var(--ink); display: block; width: 100%; max-width: 450px; height: auto; aspect-ratio: 1 / 1; }

  /* Tabel Koordinat Real-time */
  .coord-panel { margin-top: 15px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; background: #fff; }
  .coord-table { width: 100%; border-collapse: collapse; text-align: center; font-family: monospace; font-size: 0.9rem; }
  .coord-table th { background: var(--bg-page); border-bottom: 2px solid var(--ink); padding: 8px; font-family: 'Space Grotesk', sans-serif; }
  .coord-table td { padding: 8px; border-bottom: 1px solid #ddd; border-right: 1px solid #ddd; }
  .coord-table td:last-child { border-right: none; }
  .coord-table tr:last-child td { border-bottom: none; }
  .val-x { color: #ff2a55; font-weight: 700; }
  .val-y { color: #00d2ff; font-weight: 700; }

  @media (max-width: 800px) {
    body { justify-content: flex-start; padding: 80px 10px 30px 10px; overflow-y: auto; touch-action: pan-y; }
    .app-container { flex-direction: column; align-items: center; gap: 15px; }
    .panel { width: 100%; max-width: 500px; padding: 15px; }
    .back-btn { top: 15px; left: 15px; padding: 8px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>

  <div class="app-container">
    <!-- Panel Kontrol -->
    <div class="panel" style="flex: 1; min-width: 300px;">
      <h2>Geometri Transformasi</h2>
      
      <div class="shape-menu">
        <button class="shape-btn active" id="shape-segitiga" onclick="setShape('segitiga')">Segitiga</button>
        <button class="shape-btn" id="shape-persegi" onclick="setShape('persegi')">Persegi</button>
        <button class="shape-btn" id="shape-trapesium" onclick="setShape('trapesium')">Trapesium</button>
        <button class="shape-btn" id="shape-layang" onclick="setShape('layang')">Layang-layang</button>
      </div>

      <div class="tab-menu">
        <button class="tab-btn active" id="tab-translasi" onclick="setMode('translasi')">Translasi</button>
        <button class="tab-btn" id="tab-rotasi" onclick="setMode('rotasi')">Rotasi</button>
        <button class="tab-btn" id="tab-dilatasi" onclick="setMode('dilatasi')">Dilatasi</button>
        <button class="tab-btn" id="tab-refleksi" onclick="setMode('refleksi')">Refleksi</button>
      </div>

      <div class="control-group active" id="ctrl-translasi">
        <div class="control-label">Geser Sumbu X <span id="val-tx">0</span></div>
        <input type="range" id="slider-tx" min="-5" max="5" step="0.1" value="0">
        <div class="control-label">Geser Sumbu Y <span id="val-ty">0</span></div>
        <input type="range" id="slider-ty" min="-5" max="5" step="0.1" value="0">
      </div>

      <div class="control-group" id="ctrl-rotasi">
        <div class="control-label">Sudut Rotasi <span id="val-rot">0</span>°</div>
        <input type="range" id="slider-rot" min="0" max="360" step="1" value="0">
      </div>

      <div class="control-group" id="ctrl-dilatasi">
        <div class="control-label">Faktor Skala <span id="val-dil">1</span>x</div>
        <input type="range" id="slider-dil" min="0.5" max="3" step="0.1" value="1">
      </div>

      <div class="control-group" id="ctrl-refleksi">
        <div class="control-label">Sumbu Cermin</div>
        <select id="select-ref" style="width: 100%; padding: 8px; border: 2px solid var(--ink); border-radius: 6px; font-family: inherit; font-weight: 700; margin-top: 5px;">
          <option value="x">Sumbu X (Horizontal)</option>
          <option value="y">Sumbu Y (Vertikal)</option>
          <option value="y=x">Garis y = x</option>
          <option value="y=-x">Garis y = -x</option>
        </select>
      </div>

      <div class="info-box" id="info-panel"></div>
    </div>

    <!-- Panel Kanvas & Tabel -->
    <div class="panel canvas-wrap">
      <h2>Visualisasi 2D</h2>
      <canvas id="cv_transform" width="600" height="600"></canvas>
      
      <!-- Tabel Koordinat -->
      <div class="coord-panel">
        <table class="coord-table" id="coord-table">
          <thead>
            <tr>
              <th>Titik</th>
              <th>Asli (x, y)</th>
              <th>Hasil (x', y')</th>
            </tr>
          </thead>
          <tbody>
            <!-- Akan diisi oleh JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const cv = document.getElementById('cv_transform');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let view = { scale: 40, cx: W/2, cy: H/2 };

// Database Bentuk
const shapes = {
  segitiga: [
    {x: -1, y: -1},
    {x: 2, y: -1},
    {x: -1, y: 2}
  ],
  persegi: [
    {x: -1.5, y: -1.5},
    {x: 1.5, y: -1.5},
    {x: 1.5, y: 1.5},
    {x: -1.5, y: 1.5}
  ],
  trapesium: [
    {x: -2, y: -1.5},
    {x: 2, y: -1.5},
    {x: 1, y: 1.5},
    {x: -1, y: 1.5}
  ],
  layang: [
    {x: 0, y: 2},     // Atas
    {x: 2, y: 0},     // Kanan
    {x: 0, y: -2},    // Bawah
    {x: -1.5, y: 0}   // Kiri (lebih pendek)
  ]
};

let currentShapeKey = 'segitiga';
let baseShape = shapes[currentShapeKey];

let mode = 'translasi';

let targetParams = { tx: 0, ty: 0, rot: 0, dil: 1, ref: 'x' };
let currentParams = { tx: 0, ty: 0, rot: 0, dil: 1, ref: 'x' };

// Label untuk titik (A, B, C, ...)
const pointLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

function w2p(x, y) { return [ view.cx + x*view.scale, view.cy - y*view.scale ]; }

function drawScene() {
  ctx.clearRect(0, 0, W, H);

  // Grid & Sumbu
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
  for(let i=0; i<=W; i+=view.scale) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for(let i=0; i<=H; i+=view.scale) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, view.cy); ctx.lineTo(W, view.cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(view.cx, 0); ctx.lineTo(view.cx, H); ctx.stroke();

  // Gambar Bentuk Asli (Transparan)
  ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
  ctx.beginPath();
  baseShape.forEach((p, i) => {
    const [px, py] = w2p(p.x, p.y);
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);

  // Hitung posisi transformasi
  let transPoints = baseShape.map(p => {
    let x = p.x, y = p.y;
    if (mode === 'translasi') return { x: x + currentParams.tx, y: y + currentParams.ty };
    if (mode === 'rotasi') {
      const rad = currentParams.rot * Math.PI / 180;
      return { x: x * Math.cos(rad) - y * Math.sin(rad), y: x * Math.sin(rad) + y * Math.cos(rad) };
    }
    if (mode === 'dilatasi') return { x: x * currentParams.dil, y: y * currentParams.dil };
    if (mode === 'refleksi') {
      if (currentParams.ref === 'x') return { x: x, y: -y };
      if (currentParams.ref === 'y') return { x: -x, y: y };
      if (currentParams.ref === 'y=x') return { x: y, y: x };
      if (currentParams.ref === 'y=-x') return { x: -y, y: -x };
    }
    return p;
  });

  // Gambar Bentuk Hasil
  ctx.fillStyle = 'rgba(96, 195, 255, 0.4)'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
  ctx.beginPath();
  transPoints.forEach((p, i) => {
    const [px, py] = w2p(p.x, p.y);
    if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Titik Sudut & Label
  transPoints.forEach((p, i) => {
    const [px, py] = w2p(p.x, p.y);
    ctx.fillStyle = '#ffe566'; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
    
    // Label titik
    if(pointLabels[i]) {
      ctx.fillStyle = '#111'; ctx.font = 'bold 14px "Space Grotesk"';
      ctx.fillText(pointLabels[i] + "'", px + 8, py - 8);
    }
  });

  // Garis Bantu
  if(mode === 'rotasi') {
    ctx.strokeStyle = 'rgba(255, 153, 204, 0.6)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(view.cx, view.cy, view.scale * 1.41, 0, -currentParams.rot * Math.PI / 180, true); ctx.stroke(); ctx.setLineDash([]);
  } else if(mode === 'refleksi') {
    ctx.strokeStyle = 'rgba(255, 42, 85, 0.6)'; ctx.lineWidth = 3; ctx.setLineDash([8,4]);
    if(currentParams.ref === 'x') { ctx.beginPath(); ctx.moveTo(0, view.cy); ctx.lineTo(W, view.cy); ctx.stroke(); }
    if(currentParams.ref === 'y') { ctx.beginPath(); ctx.moveTo(view.cx, 0); ctx.lineTo(view.cx, H); ctx.stroke(); }
    if(currentParams.ref === 'y=x') { ctx.beginPath(); ctx.moveTo(view.cx - view.scale*6, view.cy + view.scale*6); ctx.lineTo(view.cx + view.scale*6, view.cy - view.scale*6); ctx.stroke(); }
    if(currentParams.ref === 'y=-x') { ctx.beginPath(); ctx.moveTo(view.cx - view.scale*6, view.cy - view.scale*6); ctx.lineTo(view.cx + view.scale*6, view.cy + view.scale*6); ctx.stroke(); }
    ctx.setLineDash([]);
  }

  // Update Info Box
  let info = "";
  if(mode === 'translasi') info = `Rumus: (x, y) → (x + ${targetParams.tx.toFixed(1)}, y + ${targetParams.ty.toFixed(1)})`;
  if(mode === 'rotasi') info = `Rumus: Rotasi ${targetParams.rot}° berlawanan arah jarum jam.`;
  if(mode === 'dilatasi') info = `Rumus: (x, y) → (${targetParams.dil}x, ${targetParams.dil}y)`;
  if(mode === 'refleksi') {
    if(targetParams.ref === 'x') info = `Rumus: (x, y) → (x, -y)`;
    if(targetParams.ref === 'y') info = `Rumus: (x, y) → (-x, y)`;
    if(targetParams.ref === 'y=x') info = `Rumus: (x, y) → (y, x)`;
    if(targetParams.ref === 'y=-x') info = `Rumus: (x, y) → (-y, -x)`;
  }
  document.getElementById('info-panel').innerHTML = info;

  // ==========================================
  // UPDATE TABEL KOORDINAT REAL-TIME
  // ==========================================
  let tbody = document.querySelector('#coord-table tbody');
  let html = '';
  for(let i=0; i<baseShape.length; i++) {
    const orig = baseShape[i];
    const trans = transPoints[i];
    // Tampilkan dengan 1 desimal agar rapi
    html += `
      <tr>
        <td><b>${pointLabels[i]}</b></td>
        <td>(<span class="val-x">${orig.x.toFixed(1)}</span>, <span class="val-y">${orig.y.toFixed(1)}</span>)</td>
        <td>(<span class="val-x">${trans.x.toFixed(1)}</span>, <span class="val-y">${trans.y.toFixed(1)}</span>)</td>
      </tr>
    `;
  }
  tbody.innerHTML = html;
}

// ==========================================
// LOGIKA ANIMASI LOOP
// ==========================================
function animate() {
  const lerpFactor = 0.15;
  currentParams.tx += (targetParams.tx - currentParams.tx) * lerpFactor;
  currentParams.ty += (targetParams.ty - currentParams.ty) * lerpFactor;
  currentParams.rot += (targetParams.rot - currentParams.rot) * lerpFactor;
  currentParams.dil += (targetParams.dil - currentParams.dil) * lerpFactor;
  currentParams.ref = targetParams.ref;

  drawScene();
  requestAnimationFrame(animate);
}

// ==========================================
// EVENT LISTENERS
// ==========================================
function setShape(newShape) {
  currentShapeKey = newShape;
  baseShape = shapes[newShape];
  document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`shape-${newShape}`).classList.add('active');
}

function setMode(newMode) {
  mode = newMode;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`tab-${newMode}`).classList.add('active');
  document.querySelectorAll('.control-group').forEach(el => el.classList.remove('active'));
  document.getElementById(`ctrl-${newMode}`).classList.add('active');

  targetParams = { tx: 0, ty: 0, rot: 0, dil: 1, ref: 'x' };
  currentParams = { tx: 0, ty: 0, rot: 0, dil: 1, ref: 'x' };
  
  document.getElementById('slider-tx').value = 0;
  document.getElementById('slider-ty').value = 0;
  document.getElementById('slider-rot').value = 0;
  document.getElementById('slider-dil').value = 1;
  document.getElementById('select-ref').value = 'x';
  
  document.getElementById('val-tx').innerText = "0";
  document.getElementById('val-ty').innerText = "0";
  document.getElementById('val-rot').innerText = "0";
  document.getElementById('val-dil').innerText = "1";
}

document.getElementById('slider-tx').addEventListener('input', (e) => {
  targetParams.tx = parseFloat(e.target.value);
  document.getElementById('val-tx').innerText = e.target.value;
});
document.getElementById('slider-ty').addEventListener('input', (e) => {
  targetParams.ty = parseFloat(e.target.value);
  document.getElementById('val-ty').innerText = e.target.value;
});
document.getElementById('slider-rot').addEventListener('input', (e) => {
  targetParams.rot = parseFloat(e.target.value);
  document.getElementById('val-rot').innerText = e.target.value;
});
document.getElementById('slider-dil').addEventListener('input', (e) => {
  targetParams.dil = parseFloat(e.target.value);
  document.getElementById('val-dil').innerText = e.target.value;
});
document.getElementById('select-ref').addEventListener('change', (e) => {
  targetParams.ref = e.target.value;
});

animate();
</script>
</body>
</html>
