<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animathion - Geometri Transformasi</title>
<link rel="stylesheet" href="shared/animathion.css">
<style>
  .shape-menu,.tab-menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
  .shape-btn,.tab-btn{padding:8px 12px;font:700 .85rem inherit;font-family:inherit;background:#fff;border:3px solid var(--ink);border-radius:8px;cursor:pointer;transition:.1s}
  .shape-btn:hover:not(.active),.tab-btn:hover:not(.active){background:#eee}
  .shape-btn.active{background:var(--hl-pink);box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .tab-btn.active{background:var(--hl-blue);box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .control-group{display:none;margin-bottom:15px}.control-group.active{display:block}
  select{width:100%;padding:8px;margin-top:5px;border:3px solid var(--ink);border-radius:8px;font:700 .95rem inherit;font-family:inherit;background:#fff}
  .coord-panel{margin-top:15px;overflow-x:auto}
  .coord-table{width:100%;max-width:500px;border-collapse:collapse;font:600 .9rem monospace}
  .coord-table th,.coord-table td{border:2px solid var(--ink);padding:6px 8px;text-align:center}
  .coord-table th{background:var(--hl-yellow)}
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>
  <div class="app-container">
    <div class="panel" style="flex:1;min-width:300px">
      <h2>Geometri Transformasi</h2>
      <div class="shape-menu" id="shape-menu">
        <button class="shape-btn active" data-shape="segitiga">Segitiga</button><button class="shape-btn" data-shape="persegi">Persegi</button>
        <button class="shape-btn" data-shape="trapesium">Trapesium</button><button class="shape-btn" data-shape="layang">Layang-layang</button>
      </div>
      <div class="tab-menu" id="tab-menu">
        <button class="tab-btn active" data-mode="translasi">Translasi</button><button class="tab-btn" data-mode="rotasi">Rotasi</button>
        <button class="tab-btn" data-mode="dilatasi">Dilatasi</button><button class="tab-btn" data-mode="refleksi">Refleksi</button>
      </div>
      <div class="control-group active" id="ctrl-translasi">
        <div class="control-label">Geser Sumbu X <span id="val-tx">0</span></div><input type="range" id="slider-tx" min="-5" max="5" step="0.1" value="0">
        <div class="control-label">Geser Sumbu Y <span id="val-ty">0</span></div><input type="range" id="slider-ty" min="-5" max="5" step="0.1" value="0">
      </div>
      <div class="control-group" id="ctrl-rotasi"><div class="control-label">Sudut Rotasi <span id="val-rot">0°</span></div><input type="range" id="slider-rot" min="0" max="360" step="1" value="0"></div>
      <div class="control-group" id="ctrl-dilatasi"><div class="control-label">Faktor Skala <span id="val-dil">1x</span></div><input type="range" id="slider-dil" min="0.5" max="3" step="0.1" value="1"></div>
      <div class="control-group" id="ctrl-refleksi"><div class="control-label">Sumbu Cermin</div>
        <select id="select-ref"><option value="x">Sumbu X (Horizontal)</option><option value="y">Sumbu Y (Vertikal)</option><option value="y=x">Garis y = x</option><option value="y=-x">Garis y = -x</option></select></div>
      <div class="info-box" id="info-panel"></div>
    </div>
    <div class="panel canvas-wrap">
      <h2>Visualisasi 2D</h2>
      <canvas id="cv" aria-label="Bangun datar sebelum dan sesudah transformasi"></canvas>
      <div class="coord-panel"><table class="coord-table"><thead><tr><th>Titik</th><th>Asli (x, y)</th><th>Hasil (x', y')</th></tr></thead><tbody id="coord-body"></tbody></table></div>
    </div>
  </div>
<script type="module">
import { setupCanvas, Smoother, Viewport, drawGrid, fmt, addBanner, addPresets, readState, writeState, stableBox, throttleHTML, onFrame } from './shared/core.js';
import { initMissions } from './shared/missions.js';
const $ = (id) => document.getElementById(id);
const { ctx, W, H } = setupCanvas($('cv'), 600);
const vp = new Viewport(W, H, { scale: 40 });
const shapes = {
  segitiga: [[-1, -1], [2, -1], [-1, 2]],
  persegi: [[-1.5, -1.5], [1.5, -1.5], [1.5, 1.5], [-1.5, 1.5]],
  trapesium: [[-2, -1.5], [2, -1.5], [1, 1.5], [-1, 1.5]],
  layang: [[0, 2], [2, 0], [0, -2], [-1.5, 0]],
};
const REF = { x: 0, y: Math.PI / 2, 'y=x': Math.PI / 4, 'y=-x': -Math.PI / 4 };
const DEF = { tx: 0, ty: 0, rot: 0, dil: 1, refT: 0, refA: 0 };
let base = shapes.segitiga, mode = 'translasi', shapeKey = 'segitiga', ready = false;
function save() {
  if (!ready) return;
  const t = sm.tgt, o = { s: shapeKey, m: mode };
  if (mode === 'translasi') { o.tx = t.tx; o.ty = t.ty; } else if (mode === 'rotasi') o.rot = t.rot; else if (mode === 'dilatasi') o.dil = t.dil; else o.ref = $('select-ref').value;
  writeState(o);
}

// Refleksi di-morph: titik "dipipihkan" ke garis cermin (refT=0.5), lalu terbalik ke sisi seberang (refT=1).
function tf([x, y], s) {
  if (mode === 'translasi') return [x + s.tx, y + s.ty];
  if (mode === 'rotasi') { const r = s.rot * Math.PI / 180; return [x * Math.cos(r) - y * Math.sin(r), x * Math.sin(r) + y * Math.cos(r)]; }
  if (mode === 'dilatasi') return [x * s.dil, y * s.dil];
  const nx = -Math.sin(s.refA), ny = Math.cos(s.refA), k = (1 - Math.cos(Math.PI * s.refT)) * (x * nx + y * ny);
  return [x - k * nx, y - k * ny];
}
const path = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => { const [px, py] = vp.w2p(x, y); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath(); };

function draw(s) {
  drawGrid(ctx, vp);
  ctx.setLineDash([5, 5]); ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
  path(base); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  const out = base.map((p) => tf(p, s));
  ctx.fillStyle = 'rgba(96,195,255,.4)'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3; path(out); ctx.fill(); ctx.stroke();
  out.forEach(([x, y], i) => {
    const [px, py] = vp.w2p(x, y);
    ctx.fillStyle = '#ffe566'; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#111'; ctx.font = 'bold 14px "Space Grotesk"'; ctx.textAlign = 'left'; ctx.fillText('ABCDEFGH'[i] + "'", px + 8, py - 8);
  });
  if (mode === 'rotasi') {
    ctx.strokeStyle = 'rgba(255,90,170,.8)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(vp.cx, vp.cy, vp.scale * 1.41, 0, -s.rot * Math.PI / 180, true); ctx.stroke(); ctx.setLineDash([]);
  } else if (mode === 'refleksi') {
    const dx = Math.cos(s.refA) * 20 * vp.scale, dy = Math.sin(s.refA) * 20 * vp.scale;
    ctx.strokeStyle = 'rgba(255,42,85,.7)'; ctx.lineWidth = 3; ctx.setLineDash([8, 4]);
    ctx.beginPath(); ctx.moveTo(vp.cx - dx, vp.cy + dy); ctx.lineTo(vp.cx + dx, vp.cy - dy); ctx.stroke(); ctx.setLineDash([]);
  }
  const t = sm.tgt;
  const info = {
    translasi: `Rumus: (x, y) → (x + ${fmt(t.tx)}, y + ${fmt(t.ty)})`,
    rotasi: `Rumus: rotasi ${Math.round(t.rot)}° berlawanan arah jarum jam terhadap titik (0, 0).`,
    dilatasi: `Rumus: (x, y) → (${fmt(t.dil)}x, ${fmt(t.dil)}y)`,
    refleksi: { 0: '(x, y) → (x, −y)', [Math.PI / 2]: '(x, y) → (−x, y)', [Math.PI / 4]: '(x, y) → (y, x)', [-Math.PI / 4]: '(x, y) → (−y, −x)' }[t.refA],
  }[mode];
  $('info-panel').textContent = mode === 'refleksi' ? 'Rumus: ' + info : info;
  $('coord-body').innerHTML = base.map(([x, y], i) => `<tr><td><b>${'ABCDEFGH'[i]}</b></td><td>(${fmt(x)}, ${fmt(y)})</td><td>(${fmt(out[i][0])}, ${fmt(out[i][1])})</td></tr>`).join('');
}

const sm = new Smoother(DEF, draw, { rate: 10, eps: 0.003 });
const sliders = { tx: [$('slider-tx'), $('val-tx'), ''], ty: [$('slider-ty'), $('val-ty'), ''], rot: [$('slider-rot'), $('val-rot'), '°'], dil: [$('slider-dil'), $('val-dil'), 'x'] };
for (const k in sliders) { const [inp, lbl, unit] = sliders[k]; inp.addEventListener('input', onFrame(() => { lbl.textContent = fmt(+inp.value) + unit; sm.set({ [k]: +inp.value }); save(); })); }
function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.mode === m));
  document.querySelectorAll('.control-group').forEach((g) => g.classList.toggle('active', g.id === 'ctrl-' + m));
  Object.assign(sm.cur, DEF); Object.assign(sm.tgt, DEF);
  for (const k in sliders) { const [inp, lbl, unit] = sliders[k]; inp.value = DEF[k]; lbl.textContent = fmt(DEF[k]) + unit; }
  playReflect(); if (m !== 'refleksi') sm.redraw(); save();
}
function playReflect() { if (mode !== 'refleksi') return; sm.cur.refA = sm.tgt.refA = REF[$('select-ref').value]; sm.cur.refT = 0; sm.set({ refT: 1 }); }
$('select-ref').addEventListener('change', () => { playReflect(); save(); });
$('tab-menu').addEventListener('click', (e) => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); });
$('shape-menu').addEventListener('click', (e) => {
  const k = e.target.dataset.shape; if (!k) return;
  base = shapes[k]; shapeKey = k; document.querySelectorAll('.shape-btn').forEach((b) => b.classList.toggle('active', b === e.target));
  playReflect(); sm.redraw(); save();
});
function apply(p) {
  if (p.s && shapes[p.s]) { shapeKey = p.s; base = shapes[p.s]; document.querySelectorAll('.shape-btn').forEach((b) => b.classList.toggle('active', b.dataset.shape === p.s)); }
  setMode(p.m || mode);
  for (const k of ['tx', 'ty', 'rot', 'dil']) if (p[k] !== undefined && isFinite(+p[k])) { const [inp, lbl, unit] = sliders[k]; inp.value = +p[k]; lbl.textContent = fmt(+p[k]) + unit; sm.set({ [k]: +p[k] }); }
  if (p.ref && REF[p.ref] !== undefined) { $('select-ref').value = p.ref; playReflect(); }
  save();
}
addBanner('Transformasi mengubah <b>posisi atau ukuran</b> bangun tanpa mengubah jenisnya: digeser, diputar, diperbesar, atau dicerminkan. Bayangan putus-putus adalah bangun aslinya.');
addPresets($('info-panel').parentElement, [
  { label: 'Geser (3, 2)', m: 'translasi', tx: 3, ty: 2 }, { label: 'Putar 90°', m: 'rotasi', rot: 90 }, { label: 'Putar 180°', m: 'rotasi', rot: 180 },
  { label: 'Perbesar 2x', m: 'dilatasi', dil: 2 }, { label: 'Cermin y = x', m: 'refleksi', ref: 'y=x' }], apply, $('info-panel'));
const st = readState();
if (st.m || st.s) apply(st); else setMode('translasi');
ready = true;
stableBox($('info-panel')); stableBox(document.querySelector('.coord-panel')); throttleHTML($('coord-body'));
initMissions('transformasi', () => ({ mode, ...sm.tgt, ref: $('select-ref').value, shape: shapeKey, Ap: tf(shapes.segitiga[0], sm.tgt) }), document.querySelector('.app-container'));
</script>
</body>
</html>
