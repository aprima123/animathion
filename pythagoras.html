<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animathion - Teorema Pythagoras</title>
<link rel="stylesheet" href="shared/animathion.css">
<style>
  .input-group{margin-bottom:15px}
  .input-label{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px;font-size:.95rem}
  .input-label small{font-weight:500;font-size:.75rem}
  .input-cells{display:flex;gap:10px}
  .input-cells input{flex:1;min-width:0;padding:10px;font:700 1.1rem inherit;font-family:inherit;border:3px solid var(--ink);border-radius:8px;background:#fff}
  .input-cells input[data-auto="1"]{background:var(--hl-green)}
  .input-cells input:focus{background:var(--bg-page);outline:3px solid var(--hl-purple)}
  .unit-label{display:flex;align-items:center;padding:0 12px;font-weight:700;background:var(--hl-yellow);border:3px solid var(--ink);border-radius:8px}
  .btn-reset{width:100%;padding:10px;margin:5px 0 15px;font:700 1rem inherit;font-family:inherit;background:var(--hl-pink);border:3px solid var(--ink);border-radius:8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.1s}
  .btn-reset:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
  .btn-reset:active{transform:translate(2px,2px);box-shadow:none}
  .equation-box{background:var(--bg-page);border:3px solid var(--ink);border-radius:8px;padding:12px;font:700 1.05rem monospace;line-height:1.7}
  .eq-red{color:#ff2a55}.eq-blue{color:#0098c4}.eq-green{color:#4a9a10}.eq-sub{font-size:.85rem;color:#555;font-weight:500}
  .ok{color:#2d8a0f}.bad{color:#d4183d}
  .tab-menu{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab-btn{padding:8px 12px;font:700 .85rem inherit;font-family:inherit;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:8px;cursor:pointer;transition:.1s}
  .tab-btn:hover:not(.active){background:#eee}
  .tab-btn.active{background:var(--hl-blue);box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .zoom-controls{top:130px}
</style>
</head>
<body>
  <a href="index.html" class="back-btn">← MENU</a>
  <div class="app-container">
    <div class="panel" style="flex:1;min-width:280px">
      <h2>Kalkulator Pythagoras</h2>
      <p style="margin:0 0 15px;font-size:.9rem">Isi <b>2 sisi</b> untuk mencari sisi ketiga (kotak hijau = hasil hitung), atau isi <b>3 sisi</b> untuk memeriksa apakah segitiganya siku-siku.</p>
      <div class="input-group"><div class="input-label">Sisi Alas (a)</div><div class="input-cells"><input type="number" id="inp-a" min="0" step="any" placeholder="?" value="3"><div class="unit-label">cm</div></div></div>
      <div class="input-group"><div class="input-label">Sisi Tinggi (b)</div><div class="input-cells"><input type="number" id="inp-b" min="0" step="any" placeholder="?" value="4"><div class="unit-label">cm</div></div></div>
      <div class="input-group"><div class="input-label">Sisi Miring (c)</div><div class="input-cells"><input type="number" id="inp-c" min="0" step="any" placeholder="?" data-auto="1"><div class="unit-label">cm</div></div></div>
      <button class="btn-reset" id="btn-reset">↺ Reset ke Awal</button>
      <div class="equation-box" id="equation-panel"></div>
      <div class="info-box" id="info-panel"></div>
    </div>
    <div class="panel canvas-wrap">
      <h2>Visualisasi 2D</h2>
      <div class="tab-menu" id="view-tabs"><button class="tab-btn active" data-v="segitiga">Segitiga</button><button class="tab-btn" data-v="bukti">Bukti potong-pindah</button></div>
      <canvas id="cv" aria-label="Segitiga siku-siku dan buktinya"></canvas>
      <div id="proof-ctrl" style="display:none;margin-top:12px">
        <div class="control-label">Susun c² <span>↔ Bongkar jadi a² + b²</span></div>
        <input type="range" id="proof-t" min="0" max="100" step="1" value="0" aria-label="Geser untuk menyusun dan membongkar">
        <div class="preset-row"><button class="preset-btn" id="pr-0">c²</button><button class="preset-btn" id="pr-1">a² + b²</button><button class="preset-btn" id="pr-play">▶ Mainkan</button></div>
      </div>
      <div class="zoom-controls"><button id="z_in" title="Zoom in">+</button><button id="z_out" title="Zoom out">−</button><button id="z_reset" title="Reset">⟲</button></div>
    </div>
  </div>
<script type="module">
import { setupCanvas, Smoother, Viewport, drawGrid, fmt, addBanner, addPresets, readState, writeState } from './shared/core.js';
const $ = (id) => document.getElementById(id);
const { ctx, W, H } = setupCanvas($('cv'), 600);
const vp = new Viewport(W, H, { scale: 50, min: 10, max: 200 });
vp.reset = () => { vp.scale = 50; vp.cx = 200; vp.cy = H - 200; }; vp.reset();
const el = { a: $('inp-a'), b: $('inp-b'), c: $('inp-c') };
const num = (k) => (el[k].dataset.auto === '1' || el[k].value === '' ? NaN : parseFloat(el[k].value));

function solve() {
  const v = { a: num('a'), b: num('b'), c: num('c') };
  const own = Object.keys(v).filter((k) => v[k] > 0);
  let msg = '<div style="color:#888">Isi minimal 2 sisi untuk menghitung sisi lainnya.</div>', a = 0, b = 0;
  for (const k in el) if (el[k].dataset.auto === '1' && own.length < 3) { el[k].value = ''; }
  if (own.length === 3) {
    a = v.a; b = v.b;
    const ok = Math.abs(a * a + b * b - v.c * v.c) < 0.005 * Math.max(1, v.c * v.c);
    msg = `<div><span class="eq-red">${fmt(a * a)}</span> + <span class="eq-blue">${fmt(b * b)}</span> ${ok ? '=' : '≠'} <span class="eq-green">${fmt(v.c * v.c)}</span></div>` +
      (ok ? '<div class="ok">✓ Siku-siku! Pythagoras berlaku.</div>' : `<div class="bad">✗ Bukan siku-siku. Agar siku-siku, c seharusnya ${fmt(Math.hypot(a, b), 2)}.</div>`);
  } else if (own.length === 2) {
    const miss = ['a', 'b', 'c'].find((k) => !(v[k] > 0)), [p, q] = own;
    if (miss === 'c') { v.c = Math.hypot(v.a, v.b); msg = `<div><span class="eq-red">${fmt(v.a * v.a)}</span> + <span class="eq-blue">${fmt(v.b * v.b)}</span> = <span class="eq-green">c²</span></div><div class="eq-sub">c = √(${fmt(v.a * v.a)} + ${fmt(v.b * v.b)}) = ${fmt(v.c, 2)} cm</div>`; a = v.a; b = v.b; }
    else if (v.c > v[p === 'c' ? q : p]) {
      const known = miss === 'a' ? v.b : v.a;
      v[miss] = Math.sqrt(v.c * v.c - known * known);
      msg = `<div class="eq-sub">${miss} = √(${fmt(v.c * v.c)} − ${fmt(known * known)}) = ${fmt(v[miss], 2)} cm</div>`; a = v.a; b = v.b;
    } else msg = '<div class="bad">Sisi miring (c) harus lebih panjang dari sisi lainnya.</div>';
    if (a > 0) { el[miss].value = fmt(v[miss], 2); el[miss].dataset.auto = '1'; }
  }
  $('equation-panel').innerHTML = msg;
  sm.set({ a, b });
  writeState({ v: view === 'bukti' ? 'bukti' : undefined, ...Object.fromEntries(['a', 'b', 'c'].filter((k) => el[k].dataset.auto !== '1' && el[k].value !== '').map((k) => [k, el[k].value])) });
}

function draw({ a, b, t }) {
  if (view === 'bukti') return drawProof(a, b, t);
  drawGrid(ctx, vp);
  if (a < 0.01 || b < 0.01) { $('info-panel').textContent = 'Belum ada segitiga untuk digambar.'; return; }
  const c = Math.hypot(a, b), P0 = { x: 0, y: 0 }, P1 = { x: a, y: 0 }, P2 = { x: 0, y: b };
  const p0 = vp.w2p(0, 0), p1 = vp.w2p(a, 0), p2 = vp.w2p(0, b);
  // persegi di luar segitiga: a ke bawah, b ke kiri, c ke kanan-atas
  const sq = (s, e, dir, rgb, label) => {
    const dx = e.x - s.x, dy = e.y - s.y, nx = -dir * dy, ny = dir * dx;
    const pts = [[s.x, s.y], [e.x, e.y], [e.x + nx, e.y + ny], [s.x + nx, s.y + ny]].map((p) => vp.w2p(...p));
    ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p))); ctx.closePath();
    ctx.fillStyle = `rgba(${rgb},.25)`; ctx.fill(); ctx.strokeStyle = `rgba(${rgb},.9)`; ctx.lineWidth = 2; ctx.stroke();
    const mx = (pts[0][0] + pts[2][0]) / 2, my = (pts[0][1] + pts[2][1]) / 2;
    ctx.fillStyle = '#111'; ctx.font = 'bold 14px "Space Grotesk"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, mx, my);
  };
  sq(P0, P1, -1, '255,42,85', `a² = ${fmt(a * a)}`);
  sq(P0, P2, 1, '0,168,214', `b² = ${fmt(b * b)}`);
  sq(P2, P1, 1, '115,200,43', `c² = ${fmt(c * c)}`);
  ctx.fillStyle = 'rgba(0,0,0,.1)'; ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.lineTo(...p2); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#111'; ctx.font = 'bold 15px "Space Grotesk"';
  ctx.fillText(`a = ${fmt(a)}`, (p0[0] + p1[0]) / 2, p0[1] - 12);
  ctx.fillText(`b = ${fmt(b)}`, p0[0] + 32, (p0[1] + p2[1]) / 2);
  ctx.fillText(`c = ${fmt(c)}`, (p1[0] + p2[0]) / 2 - 22, (p1[1] + p2[1]) / 2 + 16);

  const rA = Math.atan2(b, a), rB = Math.atan2(a, b), dA = rA * 180 / Math.PI, dB = rB * 180 / Math.PI;
  ctx.lineWidth = 2; ctx.font = 'bold 12px "Space Grotesk"';
  ctx.strokeStyle = ctx.fillStyle = '#ff2a55'; ctx.beginPath(); ctx.arc(p1[0], p1[1], 30, -Math.PI + rA, 0); ctx.stroke(); ctx.fillText(`${fmt(dA)}°`, p1[0] - 48, p1[1] - 14);
  ctx.strokeStyle = ctx.fillStyle = '#0098c4'; ctx.beginPath(); ctx.arc(p2[0], p2[1], 30, rA, Math.PI / 2); ctx.stroke();
  const mid = (rA + Math.PI / 2) / 2; ctx.fillText(`${fmt(dB)}°`, p2[0] + 48 * Math.cos(mid), p2[1] + 48 * Math.sin(mid));
  ctx.strokeStyle = ctx.fillStyle = '#111'; ctx.strokeRect(p0[0] + 5, p0[1] - 20, 15, 15); ctx.fillText('90°', p0[0] + 36, p0[1] - 30);
  $('info-panel').innerHTML = `<b>Sudut:</b> ${fmt(dA)}° + ${fmt(dB)}° + 90° = 180°<br><span style="font-size:.8rem;color:#555">Jumlah sudut dalam segitiga selalu 180°</span>`;
}

let view = 'segitiga';

// Bukti potong-pindah: persegi besar (a+b) berisi 4 segitiga identik.
// Susunan 1: segitiga mengelilingi persegi miring c². Susunan 2: 3 segitiga digeser (tanpa diputar),
// sisa ruangnya menjadi persegi a² dan b². Luas segitiga tetap sama, jadi c² = a² + b².
function drawProof(a, b, t) {
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (a < 0.01 || b < 0.01) { ctx.fillStyle = '#111'; ctx.font = 'bold 16px "Space Grotesk"'; ctx.fillText('Isi dua sisi dulu untuk melihat buktinya', W / 2, H / 2); $('info-panel').textContent = ''; return; }
  const s = a + b, k = 440 / s, ox = (W - s * k) / 2, oy = (H + s * k) / 2, c2 = a * a + b * b, e = t * t * (3 - 2 * t);
  const P = (x, y) => [ox + x * k, oy - y * k];
  const poly = (pts, fill, stroke, lw) => {
    ctx.beginPath(); pts.forEach(([x, y], i) => { const [px, py] = P(x, y); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); }
  };
  poly([[a, 0], [s, a], [b, s], [0, b]], `rgba(115,200,43,${0.6 * (1 - e)})`);
  poly([[0, 0], [a, 0], [a, a], [0, a]], `rgba(255,42,85,${0.5 * e})`);
  poly([[a, a], [s, a], [s, s], [a, s]], `rgba(0,168,214,${0.5 * e})`);
  const rot = [(x, y) => [x, y], (x, y) => [-y, x], (x, y) => [-x, -y], (x, y) => [y, -x]];
  [[0, a * e], [s, 0], [s - b * e, s], [a * e, s - b * e]].forEach(([tx, ty], i) =>
    poly([[0, 0], [a, 0], [0, b]].map(([x, y]) => { const [rx, ry] = rot[i](x, y); return [rx + tx, ry + ty]; }), '#ffe566', '#111', 3));
  poly([[0, 0], [s, 0], [s, s], [0, s]], null, '#111', 4);
  ctx.fillStyle = '#111'; ctx.font = 'bold 16px "Space Grotesk"';
  ctx.globalAlpha = 1 - e; ctx.fillText(`c² = ${fmt(c2)}`, ...P(s / 2, s / 2));
  ctx.globalAlpha = e; ctx.fillText(`a² = ${fmt(a * a)}`, ...P(a / 2, a / 2)); ctx.fillText(`b² = ${fmt(b * b)}`, ...P(a + b / 2, a + b / 2));
  ctx.globalAlpha = 1;
  $('info-panel').innerHTML = e < 0.5
    ? `Empat segitiga identik mengelilingi satu persegi miring. Luas sisanya: <b>c² = ${fmt(c2)}</b>.`
    : `Segitiga yang sama dipindah. Ruang sisanya kini dua persegi: <b>a² + b² = ${fmt(a * a)} + ${fmt(b * b)} = ${fmt(c2)}</b>.`;
}

const sm = new Smoother({ a: 0, b: 0, t: 0 }, draw, { rate: 10, eps: 0.005 });
for (const k in el) el[k].addEventListener('input', () => { el[k].dataset.auto = '0'; solve(); });
$('btn-reset').onclick = () => { el.a.value = 3; el.b.value = 4; el.c.value = ''; el.a.dataset.auto = el.b.dataset.auto = '0'; el.c.dataset.auto = '1'; solve(); };
vp.attach($('cv'), () => sm.redraw(), { zin: $('z_in'), zout: $('z_out'), reset: $('z_reset') });
const pick = (a, b) => { el.a.value = a; el.b.value = b; el.c.value = ''; el.a.dataset.auto = el.b.dataset.auto = '0'; el.c.dataset.auto = '1'; solve(); };
addBanner('Pada segitiga siku-siku, luas persegi di sisi miring sama dengan jumlah luas persegi di dua sisi lainnya: <b>a² + b² = c²</b>.');
addPresets($('btn-reset').parentElement, [{ label: '3-4-5', v: [3, 4] }, { label: '5-12-13', v: [5, 12] }, { label: '8-15-17', v: [8, 15] }, { label: '1-1-√2', v: [1, 1] }], (p) => pick(...p.v), $('btn-reset'));
const st = readState(), has = ['a', 'b', 'c'].filter((k) => st[k] !== undefined && +st[k] > 0);
if (has.length) for (const k of ['a', 'b', 'c']) { if (has.includes(k)) { el[k].value = st[k]; el[k].dataset.auto = '0'; } else { el[k].value = ''; el[k].dataset.auto = '1'; } }
// ---- tab Segitiga / Bukti + kontrol animasi ----
const pt = $('proof-t');
let auto = false, dir = 1, tp = 0, lastT = 0;
function stopAuto() { auto = false; $('pr-play').textContent = '▶ Mainkan'; }
function autoLoop(now) {
  if (!auto) return;
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  tp += dir * dt / 2.2; if (tp > 1.25) { dir = -1; tp = 1.25; } if (tp < -0.25) { dir = 1; tp = -0.25; } // jeda singkat di ujung
  const t = Math.max(0, Math.min(1, tp)); sm.cur.t = sm.tgt.t = t; pt.value = Math.round(t * 100); sm.redraw();
  requestAnimationFrame(autoLoop);
}
function setView(v) {
  view = v; stopAuto();
  document.querySelectorAll('#view-tabs .tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.v === v));
  $('proof-ctrl').style.display = v === 'bukti' ? 'block' : 'none';
  document.querySelector('.zoom-controls').style.display = v === 'bukti' ? 'none' : '';
  solve(); sm.redraw();
}
$('view-tabs').addEventListener('click', (e) => { if (e.target.dataset.v) setView(e.target.dataset.v); });
pt.addEventListener('input', () => { stopAuto(); sm.set({ t: +pt.value / 100 }); });
$('pr-0').onclick = () => { stopAuto(); pt.value = 0; sm.set({ t: 0 }); };
$('pr-1').onclick = () => { stopAuto(); pt.value = 100; sm.set({ t: 1 }); };
$('pr-play').onclick = () => { if (auto) return stopAuto(); auto = true; tp = +pt.value / 100; lastT = performance.now(); $('pr-play').textContent = '⏸ Hentikan'; requestAnimationFrame(autoLoop); };
if (st.v === 'bukti') setView('bukti');
solve();
</script>
</body>
</html>
