<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animathion - Interactive Math Visualizer</title>
<link rel="stylesheet" href="shared/animathion.css">
<style>
  body{padding:40px 20px;overflow-x:hidden}
  .header{text-align:center;margin-bottom:50px}
  h1{font-size:3.5rem;margin:0 0 10px;text-transform:uppercase;letter-spacing:-2px;text-shadow:3px 3px 0 var(--hl-yellow)}
  .subtitle{font-size:1.2rem;color:#555;font-weight:500;max-width:600px;margin:0 auto}
  .catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;width:100%;max-width:950px}
  .card{display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:16px;padding:30px;box-shadow:var(--shadow-lg);
    color:var(--ink);text-decoration:none;opacity:0;animation:slideUp .6s var(--snap) forwards;transition:transform .1s,box-shadow .1s}
  .card:hover{transform:translate(-4px,-4px);box-shadow:10px 10px 0 var(--ink)}
  .card:active{transform:translate(4px,4px);box-shadow:none}
  .card-icon{font-size:3rem;margin-bottom:15px}
  .card-title{font-size:1.5rem;font-weight:700;margin-bottom:10px;text-transform:uppercase}
  .card-desc{font-size:.95rem;color:#333;line-height:1.5}
  .card-stars{align-self:flex-start;margin-top:14px;font:700 .85rem inherit;font-family:inherit;background:#fff;border:3px solid var(--ink);border-radius:8px;padding:4px 10px}
  .footer{margin-top:60px;display:flex;flex-direction:column;align-items:center;gap:15px}
  .about-btn{background:#fff;border:3px solid var(--ink);padding:10px 20px;border-radius:8px;font-weight:700;color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--ink);transition:.1s}
  .about-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
  .watermark{font-size:.9rem;color:#888}
  @media(max-width:600px){h1{font-size:2.5rem}.catalog{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="header">
    <h1>ANIMATHION</h1>
    <p class="subtitle">Visualisasikan matematika. Pahami konsepnya. Jangan cuma hafal rumus.</p>
  </div>
  <div class="catalog" id="catalog"></div>
  <div class="footer">
    <a href="about.html" class="about-btn">👤 Tentang Pembuat</a>
    <div class="watermark">Dibangun oleh @aprima123</div>
  </div>
<script type="module">
import { lessons } from './lessons.js';
import { getProgress } from './shared/missions.js';
const box = document.getElementById('catalog');
lessons.forEach((l, i) => {
  const a = document.createElement('a');
  const p = getProgress(l.href.replace('.html', ''));
  a.className = 'card'; a.href = l.href; a.style.background = l.color; a.style.animationDelay = (0.1 * (i + 1)) + 's';
  a.innerHTML = `<div class="card-icon">${l.icon}</div><div class="card-title">${l.title}</div><div class="card-desc">${l.desc}</div><div class="card-stars">⭐ ${p.done}/${p.total} misi</div>`;
  box.appendChild(a);
});
</script>
</body>
</html>
